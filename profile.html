<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Profile & addresses – The Beaded Florist</title>
<meta name="description" content="Handcrafted French beaded flowers made to last. Made in Lahore, Pakistan.">
<link rel="icon" href="assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="profile" data-root="">
<div id="nav"></div>
<main id="main">

<div class="wrap account"><aside class="sidebar" id="side"></aside><form id="pform" novalidate><h1>Profile &amp; addresses</h1><p class="muted" style="margin:14px 0 24px;font-size:17px">Keep your details up to date.</p>
  <div class="card" style="margin-bottom:24px"><h3 style="margin-bottom:16px">Your details</h3>
    <div class="row2"><div class="field"><label for="p-name">Full name</label><input id="p-name" placeholder="Your name"></div><div class="field"><label for="p-phone">Phone number</label><input id="p-phone" placeholder="03XX XXXXXXX"></div></div>
    <div class="field" style="margin:0"><label for="p-email">Email</label><input id="p-email" type="email" placeholder="name@example.com"></div></div>
  <div class="card" style="margin-bottom:24px"><h3 style="margin-bottom:16px">Saved address</h3>
    <div class="field"><label for="p-address">Address</label><input id="p-address" placeholder="House 12, Street 4, Model Town"></div>
    <div class="row2" style="margin:0"><div class="field" style="margin:0"><label for="p-city">City</label><input id="p-city" placeholder="Lahore"></div><div class="field" style="margin:0"><label for="p-postal">Postal code</label><input id="p-postal" placeholder="54000"></div></div></div>
  <p class="err hidden" id="perr" role="alert"></p><button class="btn" type="submit">Save changes</button></form></div>

</main>
<div id="footer"></div>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
