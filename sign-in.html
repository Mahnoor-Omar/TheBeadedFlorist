<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in – The Beaded Florist</title>
<meta name="description" content="Handcrafted French beaded flowers made to last. Made in Lahore, Pakistan.">
<link rel="icon" href="assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="signin" data-root="">
<div id="nav"></div>
<main id="main">

<div class="wrap"><div class="auth"><img src="assets/images/hero-vase.png" alt="A beaded flower bouquet in a floral vase">
<form class="form" id="sform" novalidate><h1>Welcome back</h1><p class="muted" style="margin-bottom:22px">Sign in to see your orders and save your details.</p>
  <div class="field"><label for="s-em">Email</label><input id="s-em" type="email" placeholder="name@example.com" autocomplete="username"></div>
  <div class="field"><label for="s-pw">Password</label><input id="s-pw" type="password" placeholder="Your password" autocomplete="current-password"></div>
  <p style="margin:-6px 0 16px"><a href="#" id="forgot" style="color:var(--rose);font-size:14px">Forgot password?</a></p>
  <p class="err hidden" id="serr" role="alert" style="margin:0 0 12px"></p>
  <button class="btn full" type="submit">Sign in</button>
  <p class="muted" style="margin-top:16px">New here? <a id="to-create" href="create-account.html" style="color:var(--rose);font-weight:600">Create an account</a></p>
  <p class="demo-note">Customer demo: ayesha@example.com / password123<br>Admin demo: owner@thebeadedflorist.pk / admin1234 (opens the admin panel)</p></form></div></div>

</main>
<div id="footer"></div>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
