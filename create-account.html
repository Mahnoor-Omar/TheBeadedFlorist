<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create account – The Beaded Florist</title>
<meta name="description" content="Handcrafted French beaded flowers made to last. Made in Lahore, Pakistan.">
<link rel="icon" href="assets/images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body data-page="signup" data-root="">
<div id="nav"></div>
<main id="main">

<div class="wrap"><div class="auth"><img src="assets/images/lily-bouquet.png" alt="A pink beaded lily bouquet tied with a cream ribbon">
<form class="form" id="cform" novalidate><h1>Create your account</h1><p class="muted" style="margin-bottom:22px">Track orders and check out faster.</p>
  <div class="field"><label for="c-n">Full name</label><input id="c-n" placeholder="Your name" autocomplete="name"></div>
  <div class="field"><label for="c-e">Email</label><input id="c-e" type="email" placeholder="name@example.com" autocomplete="email"></div>
  <div class="field"><label for="c-p">Phone number</label><input id="c-p" placeholder="03XX XXXXXXX" autocomplete="tel"></div>
  <div class="field"><label for="c-pw">Password</label><input id="c-pw" type="password" placeholder="At least 8 characters" autocomplete="new-password"></div>
  <p class="err hidden" id="cerr" role="alert" style="margin:0 0 12px"></p>
  <button class="btn full" type="submit">Create account</button>
  <p class="muted" style="margin-top:16px">Already have an account? <a href="sign-in.html" style="color:var(--rose);font-weight:600">Sign in</a></p></form></div></div>

</main>
<div id="footer"></div>
<script src="assets/js/store.js"></script>
<script src="assets/js/layout.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
